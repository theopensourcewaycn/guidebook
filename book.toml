[book]
authors = ["The Open Source Way Contributors"]
language = "zh-cn"
multilingual = false
src = "."
title = "The Open Source Way 中文版"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/theopensourcewaycn/guidebook"
edit-url-template = "https://github.com/theopensourcewaycn/guidebook/edit/main-cn/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30

# PDF 输出配置（需要安装 mdbook-pdf）
[output.pdf]
optional = true

# 或者使用 mdbook-pdf-outline（另一个 PDF 生成器）
# [output.pdf-outline]
# like-wkhtmltopdf = true
